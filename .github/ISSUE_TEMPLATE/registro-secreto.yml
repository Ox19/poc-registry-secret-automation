name: "Pedido de registro de secreto"
description: "Pide registrar un secreto en un Azure Key Vault. El valor NO va acá: se carga después como secret de GitHub."
title: "[Secreto] "
labels: ["registro-secreto"]

body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **No pegues el valor acá.** Lo cargás después como **secret de GitHub**, con el nombre que te indique el bot.
        > Si hay que corregir algo, editá este issue: el bot lo vuelve a revisar solo.
        > El título no hace falta completarlo: el bot lo pone solo con el nombre del secreto y el KV.

  - type: input
    id: name
    attributes:
      label: Nombre del secreto
      description: "Con qué nombre queda el secreto en el KV. Minúsculas, números y guiones."
      placeholder: "api-token-port"
    validations:
      required: true

  - type: input
    id: vault
    attributes:
      label: Key Vault
      description: "Nombre del KV, con la nomenclatura azkv<código>eu2<d|c|p><nn>. El ambiente sale de su letra."
      placeholder: "azkvpoclabeu2d01"
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Justificación
      description: "Para qué hace falta y qué servicio lo usa. Es lo que lee el analista para aprobar."
    validations:
      required: true
