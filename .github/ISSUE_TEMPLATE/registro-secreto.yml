name: "Solicitud de registro de secreto"
description: "Solicita registrar un secreto en Azure Key Vault. El valor lo genera el sistema: no se pide acá."
title: "[Secreto] "
labels: ["registro-secreto"]

body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **En este formulario NUNCA se escribe el valor del secreto.**
        > Solo se declara la necesidad. Cuando Seguridad aprueba, el sistema genera el valor y lo registra: nadie lo ve.
        > La solicitud se valida al abrirla. Si hay que corregir algo, abrí otra: editar esta no la reprocesa.

  - type: input
    id: name
    attributes:
      label: Nombre del secreto
      description: "Minúsculas, números y guiones. Ej: github-pat-cobranzas-lectura"
      placeholder: "github-pat-cobranzas-lectura"
    validations:
      required: true

  - type: dropdown
    id: vault
    attributes:
      label: Key Vault destino
      description: "Solo se admiten Key Vaults de la lista blanca."
      options:
        - azkvecsteu2d01
        - azkvpocdeveu2d01
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options:
        - desarrollo
        - certificacion
        - produccion
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: Aplicación dueña
      placeholder: "ms-cobranzas-polizas"
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Responsable técnico
      placeholder: "@usuario"
    validations:
      required: true

  - type: input
    id: expiry
    attributes:
      label: Fecha de expiración
      description: "Formato AAAA-MM-DD. Obligatoria: todo secreto vence."
      placeholder: "2027-03-09"
    validations:
      required: true

  - type: input
    id: ticket
    attributes:
      label: Ticket relacionado
      placeholder: "RITM0492118"

  - type: textarea
    id: justification
    attributes:
      label: Justificación
      description: "Para qué se necesita este secreto."
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmación
      options:
        - label: "Confirmo que NO escribí el valor del secreto en este formulario."
          required: true
