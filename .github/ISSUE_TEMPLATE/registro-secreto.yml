name: "Solicitud de registro de secreto"
description: "Solicita registrar un secreto en Azure Key Vault. El valor lo genera el sistema: no se pide acá."
title: "[Secreto] "
labels: ["registro-secreto"]

body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Acá nunca se escribe el valor del secreto.** Solo se declara la necesidad.
        > Cuando Seguridad aprueba, el sistema lo genera y lo registra: nadie lo ve.
        > Si hay que corregir algo, abrí otra solicitud: editar esta no la reprocesa.

  - type: input
    id: name
    attributes:
      label: Nombre del secreto
      description: "Minúsculas, números y guiones."
      placeholder: "github-pat-cobranzas-lectura"
    validations:
      required: true

  - type: input
    id: vault
    attributes:
      label: Key Vault destino
      description: "El ambiente sale del propio nombre del vault. Si no está autorizado, la solicitud se rechaza."
      placeholder: "kv-poc-secretos-78e549"
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Repositorio que lo usa
      placeholder: "ms-cobranzas-polizas"
    validations:
      required: true

  - type: input
    id: expiry
    attributes:
      label: Fecha de expiración
      description: "AAAA-MM-DD. Obligatoria: todo secreto vence."
      placeholder: "2027-03-09"
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Justificación
      description: "Para qué se necesita. Es lo que Seguridad lee para decidir si aprueba."
    validations:
      required: true
