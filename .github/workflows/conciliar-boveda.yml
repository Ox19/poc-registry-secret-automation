# Compara la bóveda contra los pedidos aprobados. Cierra los que ya se cargaron y avisa de los
# secretos que aparecieron sin pedido detrás. Acá el control es detectivo: detecta, no impide.
name: "Conciliar bóveda"

on:
  schedule:
    - cron: "0 13 * * 1-5"   # días hábiles, 8am hora de Lima
  workflow_dispatch:          # y a mano, para la demo

permissions: {}

jobs:
  conciliar:
    name: Conciliar
    # Environment propio, sin aprobación: esta identidad solo puede listar nombres, no escribir.
    # Si usara el de registro, cada conciliación quedaría esperando que alguien la apruebe.
    environment: conciliacion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # checkout de los scripts
      issues: write    # comentar, etiquetar y cerrar los pedidos ya cargados
      id-token: write  # pedirle a GitHub el token OIDC que Azure valida
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Entrar a Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Solo nombres: el rol permite listar metadatos y sigue sin poder leer un valor.
      - name: Listar qué hay en la bóveda
        id: boveda
        env:
          VAULT: kv-poc-secretos-78e549
        run: |
          set -euo pipefail
          {
            echo "secrets<<FIN"
            az keyvault secret list --vault-name "$VAULT" --query "[].name" --output tsv
            echo "FIN"
          } >> "$GITHUB_OUTPUT"

      - name: Comparar contra los pedidos aprobados
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          VAULT_SECRETS: ${{ steps.boveda.outputs.secrets }}
        with:
          script: await require('./.github/scripts/conciliar-boveda.js')({ github, context, core })
