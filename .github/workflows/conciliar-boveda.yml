# Cada día: compara lo que anotó el flujo con lo que hay de verdad en los KV. El KV tiene una puerta trasera
# (el portal de Azure); esto la mira: no impide, detecta. Solo nombres y etiquetas, nunca valores.
name: "Conciliar KV"

on:
  schedule:
    - cron: "0 13 * * *"   # todos los días, 8am hora de Lima
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    name: Conciliar
    # Environment propio, sin aprobación: esta identidad solo lista nombres, no escribe.
    environment: conciliacion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # checkout de los scripts
      issues: write    # abrir el issue de alerta
      id-token: write  # pedirle a GitHub el token OIDC que Azure valida
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Pedidos registrados
        id: requests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: await require('./.github/scripts/conciliar-boveda.js').registeredRequests({ github, context, core })

      - name: Entrar a Azure
        if: steps.requests.outputs.vaults != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Solo los KV que aparecen en algún pedido; uno que no responde no frena a los demás.
      - name: Listar nombres y etiquetas de los secretos del KV
        if: steps.requests.outputs.vaults != ''
        env:
          VAULTS: ${{ steps.requests.outputs.vaults }}
        run: |
          set -uo pipefail
          inventory="$RUNNER_TEMP/inventario.json"
          echo '{}' > "$inventory"
          for vault in $VAULTS; do
              if listing="$(az keyvault secret list --vault-name "$vault" \
                      --query "[].{name:name, tags:tags, created:attributes.created}" --output json 2>/dev/null)"; then
                  jq --arg v "$vault" --argjson s "$listing" '.[$v] = {ok: true, secrets: $s}' "$inventory" > "$inventory.tmp"
              else
                  jq --arg v "$vault" '.[$v] = {ok: false, secrets: []}' "$inventory" > "$inventory.tmp"
              fi
              mv "$inventory.tmp" "$inventory"
          done

      - name: Comparar y avisar
        if: steps.requests.outputs.vaults != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        env:
          REQUESTS: ${{ steps.requests.outputs.requests }}
          INVENTORY_FILE: ${{ runner.temp }}/inventario.json
          FLOW_START: ${{ vars.FLOW_START }}
          SECURITY_TEAM: ${{ vars.SECURITY_TEAM }}
        with:
          script: await require('./.github/scripts/conciliar-boveda.js').compare({ github, context, core })
