# Cada hora: borra todo secret de GitHub que no sea el VALOR_ISSUE_<n> de un pedido abierto y con menos de 24 h.
name: "Barrer secrets de GitHub"

on:
  schedule:
    - cron: "17 * * * *"   # cada hora; una vez al día dejaría un valor hasta 47 h
  workflow_dispatch:

concurrency:
  group: barrido

permissions: {}

jobs:
  sweep:
    name: Barrer
    environment: github-app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # checkout de los scripts
      issues: write   # avisar en los pedidos vencidos
      actions: write  # cancelar las esperas de aprobación de más de 24 h
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Pedidos abiertos y esperas vencidas
        id: open
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: await require('./.github/scripts/barrer-secrets.js').openRequests({ github, context, core })

      - name: Token de la GitHub App (solo secrets de GitHub, dura 1 hora)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-secrets: write

      - name: Borrar lo que sobra
        id: sweep
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        env:
          OPEN_REQUESTS: ${{ steps.open.outputs.open }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: await require('./.github/scripts/barrer-secrets.js').sweep({ github, context, core })

      - name: Avisar en los pedidos vencidos
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        env:
          EXPIRED: ${{ steps.sweep.outputs.expired }}
          STALE: ${{ steps.open.outputs.stale }}
        with:
          script: await require('./.github/scripts/barrer-secrets.js').notify({ github, context })
