# /cargado: confirma que el valor está cargado, espera la aprobación del analista, lo escribe en el KV sin que
# nadie pueda leerlo, borra el secret de GitHub y cierra el pedido.
# La corrida nace acá, y no al abrir el issue, porque GitHub fija los secrets de una corrida al crearla: una
# corrida anterior a la carga nunca vería el valor. Además, así no se puede aprobar antes de que el valor exista.
name: "Registrar secreto"
run-name: "Registrar — #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  confirm:
    name: Confirmar el valor
    if: >-
      !github.event.issue.pull_request && github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'registro-secreto') &&
      !contains(github.event.issue.labels.*.name, 'con-errores') &&
      startsWith(github.event.comment.body, '/cargado')
    environment: github-app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # checkout de los scripts
      issues: write   # contar el estado en el issue
    outputs:
      ok: ${{ steps.report.outputs.ok }}
      gate: ${{ steps.request.outputs.gate }}
      body_sha256: ${{ steps.request.outputs.body_sha256 }}
    steps:
      # Acciones ancladas a SHA: una etiqueta se puede reapuntar a otro código.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Revisar el pedido y quién comentó
        id: request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          ALLOWED_REQUESTERS: ${{ vars.ALLOWED_REQUESTERS }}
          SECURITY_TEAM: ${{ vars.SECURITY_TEAM }}
        with:
          script: await require('./.github/scripts/validar-solicitud.js').revalidate({ github, context, core })

      # La llave de la App vive en este environment: quien carga valores no la ve ni la reemplaza.
      - name: Token de la GitHub App (solo lectura de secrets de GitHub)
        id: app
        if: steps.request.outputs.ok == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-secrets: read

      - name: Buscar el secret de GitHub del pedido
        id: find
        if: steps.request.outputs.ok == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const secret = { owner: context.repo.owner, repo: context.repo.repo, secret_name: `VALOR_ISSUE_${context.issue.number}` };
            try {
              const { data } = await github.rest.actions.getRepoSecret(secret);
              core.setOutput('found', 'true');
              core.setOutput('updated_at', data.updated_at);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('found', 'false');
            }

      - name: Contarlo en el issue
        id: report
        if: steps.request.outputs.ok == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          FOUND: ${{ steps.find.outputs.found }}
          UPDATED_AT: ${{ steps.find.outputs.updated_at }}
          SECURITY_TEAM: ${{ vars.SECURITY_TEAM }}
        with:
          script: await require('./.github/scripts/confirmar-carga.js')({ github, context, core })

  # La puerta de aprobación es el environment, elegido por la letra del KV: producción tiene la suya.
  register:
    name: Escribir en el KV
    needs: confirm
    if: needs.confirm.outputs.ok == 'true'
    environment: ${{ needs.confirm.outputs.gate }}
    # Un /cargado nuevo reemplaza a la espera anterior. A nivel de job: un comentario cualquiera no la cancela.
    concurrency:
      group: registrar-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # checkout de los scripts
      issues: read     # releer el issue antes de escribir
      actions: read    # leer quién aprobó
      id-token: write  # pedirle a GitHub el token OIDC que Azure valida
    outputs:
      reason: ${{ steps.recheck.outputs.reason || steps.write.outputs.reason }}
      version: ${{ steps.write.outputs.version }}
      alert: ${{ steps.readback.outputs.alert }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Releer lo aprobado
        id: recheck
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          APPROVED_SHA256: ${{ needs.confirm.outputs.body_sha256 }}
        with:
          script: await require('./.github/scripts/validar-solicitud.js').recheck({ github, context, core })

      - name: Entrar a Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # El valor vive solo en este step: entra por env, pasa a un archivo cerrado y se sube por su ruta.
      # Nunca va como argumento del comando, donde lo vería cualquier proceso de la máquina.
      - name: Crear el secreto en el KV
        id: write
        env:
          SECRET_VALUE: ${{ secrets[format('VALOR_ISSUE_{0}', github.event.issue.number)] }}
          SECRET_NAME: ${{ steps.recheck.outputs.name }}
          VAULT: ${{ steps.recheck.outputs.vault }}
          APPROVER: ${{ steps.recheck.outputs.approver }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          error_file="$(mktemp)"
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file" "$error_file"' EXIT
          chmod 600 "$secret_file"

          stop() { echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "::error::$2"; exit 1; }
          # Traduce el error de Azure a una causa simple; el error nunca trae el valor, que va por archivo.
          classify() {
              head -5 "$error_file"
              if grep -qiE 'ForbiddenByFirewall|Client address' "$error_file"; then stop red-cerrada "El KV tiene la red cerrada."
              elif grep -qi 'ForbiddenByRbac' "$error_file"; then stop sin-rol "La identidad no tiene rol de escritura en el KV."
              elif grep -qiE 'ForbiddenByPolicy|does not have secrets' "$error_file"; then stop access-policy "El KV usa Access Policies."
              elif grep -qiE 'ObjectIsDeletedButRecoverable|Conflict' "$error_file"; then stop en-papelera "Hay un secreto con ese nombre en la papelera del KV."
              else stop otro "Error inesperado de Azure."
              fi
          }

          if [[ -z "${SECRET_VALUE:-}" ]]; then
              stop sin-valor "No está el secret de GitHub VALOR_ISSUE_$ISSUE_NUMBER: no se cargó o venció."
          fi
          # Key Vault no avisa si el nombre existe: crearía una versión nueva encima del valor en uso.
          names="$(az keyvault secret list --vault-name "$VAULT" --query "[].name" --output tsv 2>"$error_file")" || classify
          if grep -qxF "$SECRET_NAME" <<<"$names"; then
              stop nombre-existe "Ya existe un secreto con el nombre $SECRET_NAME en el KV $VAULT."
          fi

          printf '%s' "$SECRET_VALUE" > "$secret_file"
          unset SECRET_VALUE
          secret_id="$(az keyvault secret set \
              --vault-name "$VAULT" \
              --name "$SECRET_NAME" \
              --file "$secret_file" \
              --tags "pedido=$ISSUE_NUMBER" "aprobado-por=$APPROVER" "registrado-por=registro-secretos" \
              --query id --output tsv 2>"$error_file")" || classify
          echo "version=${secret_id##*/}" >> "$GITHUB_OUTPUT"
          echo "Creado el secreto $SECRET_NAME en el KV $VAULT (versión ${secret_id##*/})."

      # Quien escribe no puede leer: si algún día la identidad tiene un rol de más, esto lo delata.
      - name: Comprobar que el pipeline no puede leer el secreto del KV
        id: readback
        env:
          SECRET_NAME: ${{ steps.recheck.outputs.name }}
          VAULT: ${{ steps.recheck.outputs.vault }}
        run: |
          set -uo pipefail
          # --query id: aunque la lectura funcionara, al log solo llega el id, nunca el valor.
          if az keyvault secret show --vault-name "$VAULT" --name "$SECRET_NAME" --query id --output tsv >/dev/null 2>denied.txt; then
              echo "alert=true" >> "$GITHUB_OUTPUT"
              echo "::error::La identidad del pipeline pudo LEER el secreto del KV: tiene más permiso del debido."
          else
              echo "alert=false" >> "$GITHUB_OUTPUT"
              echo "Azure negó la lectura, como corresponde:"
              head -3 denied.txt
          fi
          rm -f denied.txt

  # Salga como salga: el secret de GitHub del pedido se borra y se verifica que ya no esté.
  cleanup:
    name: Borrar el secret de GitHub
    needs: [confirm, register]
    if: ${{ !cancelled() && needs.confirm.outputs.ok == 'true' }}
    environment: github-app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      deleted: ${{ steps.delete.outputs.deleted }}
    steps:
      # La llave de la App vive en este environment: quien carga valores no la ve ni la reemplaza.
      - name: Token de la GitHub App (solo secrets de GitHub, dura 1 hora)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-secrets: write

      - name: Borrar solo el secret de GitHub de este pedido
        id: delete
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const secret = { owner: context.repo.owner, repo: context.repo.repo, secret_name: `VALOR_ISSUE_${context.issue.number}` };
            try { await github.rest.actions.deleteRepoSecret(secret); } catch (error) { if (error.status !== 404) throw error; }
            try {
              await github.rest.actions.getRepoSecret(secret);
              core.setOutput('deleted', 'false');
              core.setFailed(`${secret.secret_name} sigue existiendo.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('deleted', 'true');
              core.info(`${secret.secret_name} borrado.`);
            }

  report:
    name: Cerrar el pedido
    needs: [confirm, register, cleanup]
    if: ${{ !cancelled() && needs.confirm.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # checkout de los scripts
      issues: write   # comentar, etiquetar y cerrar
      actions: read   # leer quién aprobó o rechazó
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Contar el desenlace y cerrar
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          REGISTER_RESULT: ${{ needs.register.result }}
          REASON: ${{ needs.register.outputs.reason }}
          VERSION: ${{ needs.register.outputs.version }}
          ALERT: ${{ needs.register.outputs.alert }}
          DELETED: ${{ needs.cleanup.outputs.deleted }}
          SECURITY_TEAM: ${{ vars.SECURITY_TEAM }}
        with:
          script: await require('./.github/scripts/reportar-registro.js')({ github, context })
