# Registra un secreto sin que nadie vea el valor: valida, espera la aprobación de Seguridad,
# lo genera en el runner y lo registra. La batería de fugas es solo PoC y corre sobre canarios.
name: "Registrar secreto"
run-name: "Registrar — #${{ github.event.issue.number }}"

# Solo al abrir: una solicitud es un issue; para corregirla se abre otro.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  # Si la solicitud no es válida, se cierra y el resto no corre.
  validate:
    name: Validar solicitud
    if: contains(github.event.issue.labels.*.name, 'registro-secreto')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # checkout de los scripts
      issues: write   # comentar y cerrar
    outputs:
      body_sha256: ${{ steps.check.outputs.body_sha256 }}
    steps:
      # Acciones ancladas a SHA: una etiqueta se puede reapuntar a otro código.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Validar metadatos del formulario
        id: check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: await require('./.github/scripts/validar-solicitud.js').check({ github, context, core })

  # La aprobación de Seguridad es este environment; también ancla la identidad OIDC de la Etapa 2.
  register:
    name: Generar y registrar
    needs: validate
    environment: registro-secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # checkout de los scripts
      issues: read     # releer el issue antes de generar
      id-token: write  # pedirle a GitHub el token OIDC que Azure valida
    outputs:
      name: ${{ steps.recheck.outputs.name }}
      vault: ${{ steps.recheck.outputs.vault }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Revalidar lo aprobado
        id: recheck
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          APPROVED_SHA256: ${{ needs.validate.outputs.body_sha256 }}
        with:
          script: await require('./.github/scripts/validar-solicitud.js').recheck({ github, context, core })

      # Identidad federada: GitHub firma un token, Azure lo valida. No hay ninguna contraseña guardada.
      # Son identificadores, no credenciales; van como secrets del environment solo porque este repo
      # es público: así quedan enmascarados en los logs y solo los ve el job ya aprobado.
      - name: Entrar a Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Un solo step: el valor nace, se registra y muere acá. Nunca va a GITHUB_ENV.
      - name: Generar y registrar en Key Vault
        env:
          SECRET_NAME: ${{ steps.recheck.outputs.name }}
          VAULT: ${{ steps.recheck.outputs.vault }}
        run: |
          set -euo pipefail
          # Por archivo con permisos cerrados y borrado al salir, si fuese como argumento quedaría visible en ps.
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          chmod 600 "$secret_file"
          node .github/scripts/generar-secreto.js > "$secret_file"
          echo "::add-mask::$(cat "$secret_file")"
          # Sin --expires: la compañía no maneja vencimiento en sus secretos (decidido el 2026-09-17).
          az keyvault secret set \
              --vault-name "$VAULT" \
              --name "$SECRET_NAME" \
              --file "$secret_file" \
              --output none
          echo "Registrado: $SECRET_NAME en $VAULT."

      # La prueba de la PoC: el mismo job que acaba de escribir no puede releer. Si algún día
      # alguien le da un rol de más a la identidad, este step lo delata y el registro falla.
      - name: Comprobar que ni el pipeline puede leer el valor
        env:
          SECRET_NAME: ${{ steps.recheck.outputs.name }}
          VAULT: ${{ steps.recheck.outputs.vault }}
        run: |
          set -euo pipefail
          if denial="$(az keyvault secret show --vault-name "$VAULT" --name "$SECRET_NAME" 2>&1)"; then
              echo "::error::El pipeline pudo LEER el secreto: la identidad tiene permisos de más."
              exit 1
          fi
          # Solo el motivo: cuando Azure deniega, la respuesta no incluye el valor.
          echo "Azure denegó la lectura, como corresponde:"
          printf '%s\n' "$denial" | head -3


  # Corre también si el registro falló o se rechazó la aprobación, para dejarlo en el issue.
  report:
    name: Reportar resultado
    needs: [validate, register]
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # checkout de los scripts
      issues: write   # comentar, etiquetar y cerrar
      actions: read   # leer quién aprobó
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Comentar y cerrar
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        env:
          REGISTER_RESULT: ${{ needs.register.result }}
          SECRET_NAME: ${{ needs.register.outputs.name }}
          VAULT: ${{ needs.register.outputs.vault }}
        with:
          script: await require('./.github/scripts/reportar-registro.js')({ github, context })
