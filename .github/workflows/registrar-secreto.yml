# /cargado: confirma que el valor está cargado, espera la aprobación del analista, lo escribe en el KV sin que
# nadie pueda leerlo, borra el secret de GitHub y cierra el pedido.
# La corrida nace acá, y no al abrir el issue, porque GitHub fija los secrets de una corrida al crearla: una
# corrida anterior a la carga nunca vería el valor. Además, así no se puede aprobar antes de que el valor exista.
name: "Registrar secreto"
run-name: "Registrar — #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  confirm:
    name: Confirmar el valor
    if: >-
      !github.event.issue.pull_request && github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'registro-secreto') &&
      !contains(github.event.issue.labels.*.name, 'con-errores') &&
      startsWith(github.event.comment.body, '/cargado')
    environment: github-app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # checkout de los scripts
      issues: write   # contar el estado en el issue
    outputs:
      ok: ${{ steps.report.outputs.ok }}
      gate: ${{ steps.request.outputs.gate }}
      body_sha256: ${{ steps.request.outputs.body_sha256 }}
    steps:
      # Acciones ancladas a SHA: una etiqueta se puede reapuntar a otro código.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Revisar el pedido y quién comentó
        id: request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        env:
          ALLOWED_REQUESTERS: ${{ vars.ALLOWED_REQUESTERS }}
          SECURITY_TEAM: ${{ vars.SECURITY_TEAM }}
        with:
          script: await require('./.github/scripts/validar-solicitud.js').revalidate({ github, context, core })

      # La llave de la App vive en este environment: quien carga valores no la ve ni la reemplaza.
      - name: Token de la GitHub App (solo lectura de secrets de GitHub)
        id: app
        if: steps.request.outputs.ok == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-secrets: read

      - name: Buscar el secret de GitHub del pedido
        id: find
        if: steps.request.outputs.ok == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const secret = { owner: context.repo.owner, repo: context.repo.repo, secret_name: `VALOR_ISSUE_${context.issue.number}` };
            try {
              const { data } = await github.rest.actions.getRepoSecret(secret);
              core.setOutput('found', 'true');
              core.setOutput('updated_at', data.updated_at);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('found', 'false');
            }

      - name: Contarlo en el issue
        id: report
        if: steps.request.outputs.ok == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        env:
          FOUND: ${{ steps.find.outputs.found }}
          UPDATED_AT: ${{ steps.find.outputs.updated_at }}
          SECURITY_TEAM: ${{ vars.SECURITY_TEAM }}
        with:
          script: await require('./.github/scripts/confirmar-carga.js')({ github, context, core })

  # La puerta de aprobación es el environment, elegido por la letra del KV: producción tiene la suya.
  register:
    name: Escribir en el KV
    needs: confirm
    if: needs.confirm.outputs.ok == 'true'
    environment: ${{ needs.confirm.outputs.gate }}
    # Un /cargado nuevo reemplaza a la espera anterior. A nivel de job: un comentario cualquiera no la cancela.
    concurrency:
      group: registrar-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # checkout de los scripts
      issues: read     # releer el issue antes de escribir
      actions: read    # leer quién aprobó
      id-token: write  # pedirle a GitHub el token OIDC que Azure valida
    outputs:
      reason: ${{ steps.recheck.outputs.reason || steps.write.outputs.reason }}
      results: ${{ steps.write.outputs.results }}
      phase: ${{ steps.write.outputs.phase }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Releer lo aprobado
        id: recheck
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        env:
          APPROVED_SHA256: ${{ needs.confirm.outputs.body_sha256 }}
        with:
          script: await require('./.github/scripts/validar-solicitud.js').recheck({ github, context, core })

      - name: Entrar a Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Escritura atómica en los N KV: primero se pre-chequean TODOS; si uno falla, no se escribe en ninguno.
      # El valor vive solo en este step: entra por env, pasa a un archivo cerrado (reutilizado para cada KV)
      # y se sube por su ruta. Nunca va como argumento del comando, donde lo vería cualquier proceso.
      - name: Escribir en los KV (pre-chequeo atómico, luego escritura)
        id: write
        env:
          SECRET_VALUE: ${{ secrets[format('VALOR_ISSUE_{0}', github.event.issue.number)] }}
          SECRET_NAME: ${{ steps.recheck.outputs.name }}
          VAULTS: ${{ steps.recheck.outputs.vaults }}
          APPROVER: ${{ steps.recheck.outputs.approver }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          error_file="$(mktemp)"
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file" "$error_file"' EXIT
          chmod 600 "$secret_file"

          # Los KV llegan como array JSON; sus nombres son seguros (patrón azkv...eu2<dcp><nn>).
          mapfile -t vaults < <(jq -r '.[]' <<<"$VAULTS")

          emit() { echo "phase=$1" >> "$GITHUB_OUTPUT"; echo "results=$2" >> "$GITHUB_OUTPUT"; }
          # Traduce el error de Azure a una causa simple; el error nunca trae el valor, que va por archivo.
          classify() {
              head -5 "$error_file" >&2
              if grep -qiE 'ForbiddenByFirewall|Client address' "$error_file"; then echo red-cerrada
              elif grep -qi 'ForbiddenByRbac' "$error_file"; then echo sin-rol
              elif grep -qiE 'ForbiddenByPolicy|does not have secrets' "$error_file"; then echo access-policy
              elif grep -qiE 'ObjectIsDeletedButRecoverable|Conflict' "$error_file"; then echo en-papelera
              else echo otro
              fi
          }

          if [[ -z "${SECRET_VALUE:-}" ]]; then
              echo "reason=sin-valor" >> "$GITHUB_OUTPUT"; emit aborted '[]'
              echo "::error::No está el secret de GitHub VALOR_ISSUE_$ISSUE_NUMBER: no se cargó o venció."; exit 1
          fi
          if [[ "${#vaults[@]}" -eq 0 ]]; then
              echo "reason=otro" >> "$GITHUB_OUTPUT"; emit aborted '[]'
              echo "::error::El pedido no tiene KV."; exit 1
          fi

          # FASE 1 — pre-chequear TODOS. Key Vault no avisa si el nombre ya existe: pisaría el valor en uso.
          preflight='[]'; aborted=0
          for vault in "${vaults[@]}"; do
              problem=""
              if names="$(az keyvault secret list --vault-name "$vault" --query "[].name" --output tsv 2>"$error_file")"; then
                  if grep -qxF "$SECRET_NAME" <<<"$names"; then problem="nombre-existe"; fi
              else
                  problem="$(classify)"
              fi
              [[ -n "$problem" ]] && aborted=1
              preflight="$(jq -c --arg v "$vault" --arg p "$problem" '. + [{vault:$v, problem:$p}]' <<<"$preflight")"
          done
          if [[ "$aborted" -eq 1 ]]; then
              results="$(jq -c '[.[] | {vault, status:"no-escrito", reason:.problem}]' <<<"$preflight")"
              emit aborted "$results"
              echo "::error::El pre-chequeo falló en al menos un KV: no se escribió en ninguno."; exit 1
          fi

          # FASE 2 — escritura (todos pasaron). Un solo archivo con el valor, reutilizado para cada KV.
          printf '%s' "$SECRET_VALUE" > "$secret_file"
          unset SECRET_VALUE
          results='[]'; phase=done
          for vault in "${vaults[@]}"; do
              if secret_id="$(az keyvault secret set \
                      --vault-name "$vault" \
                      --name "$SECRET_NAME" \
                      --file "$secret_file" \
                      --tags "pedido=$ISSUE_NUMBER" "aprobado-por=$APPROVER" "registrado-por=registro-secretos" \
                      --query id --output tsv 2>"$error_file")"; then
                  version="${secret_id##*/}"
                  # Prueba del 403: quien escribe no debe poder releer. --query id: al log solo llega el id.
                  if az keyvault secret show --vault-name "$vault" --name "$SECRET_NAME" --query id --output tsv >/dev/null 2>"$error_file"; then
                      alert="true"; echo "::error::La identidad pudo LEER el secreto en $vault: tiene más permiso del debido."
                  else
                      alert="false"
                  fi
                  results="$(jq -c --arg v "$vault" --arg ver "$version" --arg a "$alert" '. + [{vault:$v, status:"registrado", version:$ver, alert:$a}]' <<<"$results")"
                  echo "Creado $SECRET_NAME en $vault (versión $version)."
              else
                  # Carrera rara: pasó el pre-chequeo pero la escritura falló. Estado parcial: lo resuelve un humano.
                  reason="$(classify)"
                  results="$(jq -c --arg v "$vault" --arg r "$reason" '. + [{vault:$v, status:"fallido", reason:$r}]' <<<"$results")"
                  phase=partial
                  echo "::error::Falló la escritura en $vault ($reason) tras pasar el pre-chequeo: estado parcial."; break
              fi
          done
          emit "$phase" "$results"
          [[ "$phase" == "partial" ]] && exit 1
          true

  # Salga como salga: el secret de GitHub del pedido se borra y se verifica que ya no esté.
  cleanup:
    name: Borrar el secret de GitHub
    needs: [confirm, register]
    if: ${{ !cancelled() && needs.confirm.outputs.ok == 'true' }}
    environment: github-app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      deleted: ${{ steps.delete.outputs.deleted }}
    steps:
      # La llave de la App vive en este environment: quien carga valores no la ve ni la reemplaza.
      - name: Token de la GitHub App (solo secrets de GitHub, dura 1 hora)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-secrets: write

      - name: Borrar solo el secret de GitHub de este pedido
        id: delete
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const secret = { owner: context.repo.owner, repo: context.repo.repo, secret_name: `VALOR_ISSUE_${context.issue.number}` };
            try { await github.rest.actions.deleteRepoSecret(secret); } catch (error) { if (error.status !== 404) throw error; }
            try {
              await github.rest.actions.getRepoSecret(secret);
              core.setOutput('deleted', 'false');
              core.setFailed(`${secret.secret_name} sigue existiendo.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('deleted', 'true');
              core.info(`${secret.secret_name} borrado.`);
            }

  report:
    name: Cerrar el pedido
    needs: [confirm, register, cleanup]
    if: ${{ !cancelled() && needs.confirm.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # checkout de los scripts
      issues: write   # comentar, etiquetar y cerrar
      actions: read   # leer quién aprobó o rechazó
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Contar el desenlace y cerrar
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        env:
          PHASE: ${{ needs.register.outputs.phase }}
          RESULTS: ${{ needs.register.outputs.results }}
          REASON: ${{ needs.register.outputs.reason }}
          DELETED: ${{ needs.cleanup.outputs.deleted }}
          SECURITY_TEAM: ${{ vars.SECURITY_TEAM }}
        with:
          script: await require('./.github/scripts/reportar-registro.js')({ github, context })
